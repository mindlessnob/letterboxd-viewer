name: RSS Feed Update

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:       # Allows manual triggering

permissions:
  contents: write
  actions: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow beautifulsoup4 lxml

      - name: Run RSS feed download script
        env:
          LETTERBOXD_RSS_URL: ${{ secrets.LETTERBOXD_RSS_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/download_rss.py

      - name: Commit and push if changes exist
        id: commit-push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add assets/images data/archive.json data/archive.js
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto update film diary archive"
            git pull origin main --rebase
            git push
            echo "changes_pushed=true" >> $GITHUB_OUTPUT
          )

      - name: Trigger deploy workflow
        if: steps.commit-push.outputs.changes_pushed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            })
