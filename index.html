<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>Moon's Film Diary</title>
	<script>
		(function () {
			var saved = localStorage.getItem('diary_theme');
			var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
			document.documentElement.setAttribute('data-theme', theme);
		})();
	</script>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="assets/css/editorial.css" />
</head>
<body>
	<!-- Masthead -->
	<header class="masthead">
		<div class="masthead-inner">
			<a href="#" class="brand" id="brandHome">
				<h1 class="brand-title">Moon’s <em>Film Diary</em></h1>
				<span class="brand-meta">Screening Journal</span>
			</a>
			<div class="masthead-actions">
				<div class="search-wrap">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
					<input type="search" id="searchInput" class="search-input" placeholder="Search films or reviews…" aria-label="Search films" />
					<span class="search-kbd">/</span>
				</div>
				<button type="button" class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme"></button>
			</div>
		</div>
	</header>

	<main class="container">
		<!-- Latest Reviews Carousel Hero -->
		<section class="hero-section" id="heroSection" hidden></section>

		<!-- Filters, View Toggle & Sort -->
		<section class="toolbar" aria-label="Filter and sort diary">
			<div class="filter-pills" id="filterPills">
				<button type="button" class="pill active" data-filter="all">All Films <span class="count" id="countAll">0</span></button>
				<button type="button" class="pill" data-filter="reviews">Reviews <span class="count" id="countReviews">0</span></button>
				<button type="button" class="pill" data-filter="liked">Liked ♥ <span class="count" id="countLiked">0</span></button>
				<button type="button" class="pill" data-filter="top">4★ &amp; Up <span class="count" id="countTop">0</span></button>
				<button type="button" class="pill" data-filter="rewatch">Rewatches <span class="count" id="countRewatch">0</span></button>
				<button type="button" class="pill" data-filter="lists">Curated Lists <span class="count" id="countLists">0</span></button>
			</div>

			<div class="toolbar-right" id="toolbarRight">
				<div class="view-toggle" id="viewToggle" role="group" aria-label="Switch layout view">
					<button type="button" class="view-btn active" data-view="grid" title="Poster grid">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
						Grid
					</button>
					<button type="button" class="view-btn" data-view="diary" title="Chronological diary list">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
						Diary
					</button>
				</div>
				<select id="yearSelect" class="sort-select" aria-label="Filter by watched year">
					<option value="all">All Years</option>
				</select>
				<select id="sortSelect" class="sort-select" aria-label="Sort films">
					<option value="recent">Recently Watched</option>
					<option value="rating-desc">Highest Rated</option>
					<option value="year-desc">Release Year (Newest)</option>
					<option value="year-asc">Release Year (Oldest)</option>
					<option value="title-asc">Title (A–Z)</option>
				</select>
			</div>
		</section>

		<!-- Content Grid / Diary List -->
		<section id="contentArea">
			<div class="state-box">Loading screening journal…</div>
		</section>
	</main>

	<!-- Colophon Footer -->
	<footer class="colophon">
		<div class="container colophon-inner">
			<div class="colophon-stats" id="colophonStats"></div>
			<div class="colophon-links">
				<span>Moon’s Film Diary</span>
			</div>
		</div>
	</footer>

	<!-- Split-Screen Reader Modal -->
	<div class="modal-backdrop" id="readerBackdrop" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
		<div class="reader-modal" id="readerModal">
			<aside class="reader-aside" id="readerAside">
				<img src="" alt="" class="reader-poster" id="readerPoster" />
				<div class="reader-facts" id="readerFacts"></div>
			</aside>
			<div class="reader-content">
				<div class="reader-top-bar">
					<div class="reader-nav">
						<button type="button" class="icon-btn" id="prevBtn" title="Previous (←)" aria-label="Previous entry">←</button>
						<button type="button" class="icon-btn" id="nextBtn" title="Next (→)" aria-label="Next entry">→</button>
						<span class="reader-counter" id="readerCounter"></span>
					</div>
					<div class="reader-top-actions">
						<button type="button" class="btn-ghost" id="shareCardBtn" style="padding: 0.32rem 0.78rem; font-size: 0.73rem;">Share card</button>
						<button type="button" class="btn-ghost" id="copyLinkBtn" style="padding: 0.32rem 0.78rem; font-size: 0.73rem;">Copy link</button>
						<button type="button" class="icon-btn" id="closeReaderBtn" title="Close (Esc)" aria-label="Close modal">✕</button>
					</div>
				</div>
				<div class="reader-scroll" id="readerScroll">
					<h2 class="reader-title" id="readerTitle"></h2>
					<p class="reader-director" id="readerDirector" hidden></p>
					<div class="reader-subtitle" id="readerSubtitle"></div>
					<div class="reader-prose" id="readerProse"></div>
				</div>
			</div>
		</div>
	</div>

	<!-- Shareable Review / Diary Card Modal -->
	<div class="modal-backdrop" id="shareBackdrop" role="dialog" aria-modal="true" aria-labelledby="shareHeading">
		<div class="share-modal">
			<div class="share-header">
				<div>
					<h2 id="shareHeading">Shareable Card</h2>
					<p>Export a clean PNG for Instagram, X, or messages.</p>
				</div>
				<button type="button" class="icon-btn" id="closeShareBtn" aria-label="Close share dialog">✕</button>
			</div>

			<div class="share-controls">
				<div class="share-control-row">
					<div class="view-toggle" id="shareStyleToggle" role="group" aria-label="Card design style">
						<button type="button" class="view-btn active" data-style="editorial">Editorial</button>
						<button type="button" class="view-btn" data-style="cinema">Cinema</button>
						<button type="button" class="view-btn" data-style="minimal">Minimal</button>
						<button type="button" class="view-btn" data-style="ticket">Ticket</button>
					</div>
				</div>
				<div class="share-control-row">
					<div class="view-toggle" id="shareFormatToggle" role="group" aria-label="Card aspect ratio">
						<button type="button" class="view-btn active" data-format="card">4:5 Card</button>
						<button type="button" class="view-btn" data-format="story">9:16 Story</button>
					</div>
					<div class="view-toggle" id="shareThemeToggle" role="group" aria-label="Card color theme">
						<button type="button" class="view-btn active" data-card-theme="dark">Dark</button>
						<button type="button" class="view-btn" data-card-theme="light">Light</button>
					</div>
					<button type="button" class="toggle-chip active" id="shareReviewBtn" aria-pressed="true">
						<span id="shareReviewIcon">✓</span>
						<span>Review text</span>
					</button>
				</div>
			</div>

			<div class="share-preview-stage">
				<canvas id="shareCanvas" class="share-canvas"></canvas>
			</div>

			<div class="share-footer">
				<button type="button" class="btn-primary" id="downloadCardBtn" style="width: 100%; justify-content: center;">Download PNG</button>
			</div>
		</div>
	</div>

	<!-- Toasts -->
	<div class="toast-stack" id="toastStack"></div>

	<script src="assets/js/app.js" defer></script>
</body>
</html>
